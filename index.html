<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Smart Assignment & Research Workspace</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Marquee Ticker Animation */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 24s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Dynamic Icon Wrapper Component
        const LucideIcon = ({ name, className = "w-5 h-5", ...props }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;
                containerRef.current.innerHTML = '';

                if (window.lucide) {
                    const iconData = window.lucide.icons[name] || window.lucide.icons[name.charAt(0).toLowerCase() + name.slice(1)];
                    
                    if (iconData && typeof window.lucide.createElement === 'function') {
                        const svg = window.lucide.createElement(iconData);
                        if (className) svg.setAttribute('class', className);
                        containerRef.current.appendChild(svg);
                        return;
                    }

                    const kebabName = name
                        .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                        .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
                        .toLowerCase();

                    const iElem = document.createElement('i');
                    iElem.setAttribute('data-lucide', kebabName);
                    if (className) iElem.setAttribute('class', className);
                    containerRef.current.appendChild(iElem);

                    if (typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons({
                            nameAttr: 'data-lucide'
                        });
                    }
                }
            }, [name, className]);

            return <span ref={containerRef} className="inline-flex items-center justify-center" {...props} />;
        };

        const DEFAULT_SUBJECTS = [
            { id: 'subj-1', name: 'Machine Learning', color: 'bg-indigo-500', text: 'text-indigo-500', border: 'border-indigo-500', hex: '#6366f1' },
            { id: 'subj-2', name: 'Data Structures', color: 'bg-amber-500', text: 'text-amber-500', border: 'border-amber-500', hex: '#f59e0b' },
            { id: 'subj-3', name: 'Research Methodology', color: 'bg-orange-500', text: 'text-orange-500', border: 'border-orange-500', hex: '#f97316' },
            { id: 'subj-4', name: 'Database Systems', color: 'bg-slate-900', text: 'text-slate-900', border: 'border-slate-900', hex: '#0f172a' },
        ];

        const DEFAULT_ASSIGNMENTS = [
            { id: 'assg-1', title: 'Neural Network Classification Report', subject: 'Machine Learning', status: 'Done', dueDate: '2026-08-15', priority: 'High', estimatedHours: 4, completedHours: 4 },
            { id: 'assg-2', title: 'Binary Search Tree Implementation', subject: 'Data Structures', status: 'Done', dueDate: '2026-08-18', priority: 'Medium', estimatedHours: 3.5, completedHours: 3.5 },
            { id: 'assg-3', title: 'Literature Review on AI Ethics', subject: 'Research Methodology', status: 'In Progress', dueDate: '2026-08-22', priority: 'High', estimatedHours: 5, completedHours: 2 },
            { id: 'assg-4', title: 'Relational Database ERD Design', subject: 'Database Systems', status: 'Pending', dueDate: '2026-08-25', priority: 'Medium', estimatedHours: 3, completedHours: 0 }
        ];

        const DEFAULT_RESEARCH = [
            { id: 'res-1', title: 'Deep Learning for Medical Image Analysis', type: 'Book', author: 'Ian Goodfellow et al.', subject: 'Machine Learning', summary: 'Comprehensive guide covering convolutional neural networks and generative adversarial models.', link: 'https://example.com/deeplearning-book' },
            { id: 'res-2', title: 'Attention Is All You Need', type: 'Paper', author: 'Vaswani et al. (2017)', subject: 'Machine Learning', summary: 'The foundational paper introducing the Transformer architecture for deep learning.', link: 'https://arxiv.org/abs/1706.03762' },
            { id: 'res-3', title: 'Modern Database Indexing Techniques', type: 'Article', author: 'Dr. Sarah Connor', subject: 'Database Systems', summary: 'Explores B-Trees, LSM-Trees, and Hash indexing performance in high-throughput database systems.', link: 'https://example.com/indexing-article' }
        ];

        const DEFAULT_USERS = [
            { id: 'u-admin', name: 'System Admin', email: 'admin@studytrack.com', role: 'admin', approved: true, blocked: false, createdAt: '2026-08-01' },
            { id: 'u-student1', name: 'Tanvir Ahmed', email: 'tanvir@student.edu', role: 'student', approved: true, blocked: false, createdAt: '2026-08-05' },
            { id: 'u-student2', name: 'Sumi Rahman', email: 'sumi@student.edu', role: 'student', approved: false, blocked: false, createdAt: '2026-08-11' }
        ];

        const DEFAULT_CIVICON = [
            { id: 'civ-1', title: 'Civicon Structural Bridge Model Competition 2026', date: '2026-09-05', category: 'Competition', description: 'Annual structural design competition hosted by WUB Civil Engineering Club at the main campus.' },
            { id: 'civ-2', title: 'AutoCAD & Surveying Practical Workshop', date: '2026-08-28', category: 'Workshop', description: 'Hands-on training session for WUB Civil students on advanced digital surveying equipment.' }
        ];

        function App() {
            // Auth & Session State
            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('studytrack_users');
                return saved ? JSON.parse(saved) : DEFAULT_USERS;
            });

            const [currentUser, setCurrentUser] = useState(() => {
                const savedUser = localStorage.getItem('studytrack_current_user');
                return savedUser ? JSON.parse(savedUser) : DEFAULT_USERS[0];
            });

            const [authMode, setAuthMode] = useState('app'); // 'app', 'login', 'signup', 'pending'
            const [loginEmail, setLoginEmail] = useState('');
            const [signupName, setSignupName] = useState('');
            const [signupEmail, setSignupEmail] = useState('');
            const [authError, setAuthError] = useState('');

            // Navigation and Filters
            const [activeTab, setActiveTab] = useState('dashboard');
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');

            // Pomodoro Timer State
            const [timerSeconds, setTimerSeconds] = useState(25 * 60);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [timerMode, setTimerMode] = useState('work'); // 'work' | 'break'

            // Core Data States
            const [subjects, setSubjects] = useState(() => {
                const saved = localStorage.getItem(`studytrack_subjects_${currentUser?.id || 'admin'}`);
                return saved ? JSON.parse(saved) : DEFAULT_SUBJECTS;
            });

            const [assignments, setAssignments] = useState(() => {
                const saved = localStorage.getItem(`studytrack_assignments_${currentUser?.id || 'admin'}`);
                return saved ? JSON.parse(saved) : DEFAULT_ASSIGNMENTS;
            });

            const [researchList, setResearchList] = useState(() => {
                const saved = localStorage.getItem(`studytrack_research_${currentUser?.id || 'admin'}`);
                return saved ? JSON.parse(saved) : DEFAULT_RESEARCH;
            });

            const [civiconPosts, setCiviconPosts] = useState(() => {
                const saved = localStorage.getItem('studytrack_civicon_posts');
                return saved ? JSON.parse(saved) : DEFAULT_CIVICON;
            });

            // Civicon Post Form
            const [civTitle, setCivTitle] = useState('');
            const [civCategory, setCivCategory] = useState('Event');
            const [civDesc, setCivDesc] = useState('');
            const [civDate, setCivDate] = useState('');
            const [civAddedMsg, setCivAddedMsg] = useState(false);

            // Admin Moving Notice Ticker
            const [adminNotice, setAdminNotice] = useState(() => {
                return localStorage.getItem('studytrack_admin_notice') || '📌 Notice: Mid-Semester Assignments submission deadline is next Sunday! Please review your research logs on time.';
            });
            const [noticeInput, setNoticeInput] = useState(adminNotice);
            const [noticeSavedMsg, setNoticeSavedMsg] = useState(false);

            // Maintenance Mode State
            const [isMaintenanceMode, setIsMaintenanceMode] = useState(() => {
                return localStorage.getItem('studytrack_maintenance_mode') === 'true';
            });

            // Modals State
            const [isAddAssignmentOpen, setIsAddAssignmentOpen] = useState(false);
            const [isAddSubjectOpen, setIsAddSubjectOpen] = useState(false);
            const [isAddResearchOpen, setIsAddResearchOpen] = useState(false);

            // AI Assistant State
            const [aiMessages, setAiMessages] = useState([
                { sender: 'ai', text: 'Hello! I am your AI Research Assistant. I can help analyze your saved papers, books, and articles, summarize complex topics, or assist with literature reviews.' }
            ]);
            const [aiInput, setAiInput] = useState('');
            const [aiLoading, setAiLoading] = useState(false);
            const [enableWebSearch, setEnableWebSearch] = useState(true);

            useEffect(() => {
                localStorage.setItem('studytrack_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('studytrack_civicon_posts', JSON.stringify(civiconPosts));
            }, [civiconPosts]);

            useEffect(() => {
                localStorage.setItem('studytrack_admin_notice', adminNotice);
            }, [adminNotice]);

            useEffect(() => {
                localStorage.setItem('studytrack_maintenance_mode', isMaintenanceMode);
            }, [isMaintenanceMode]);

            useEffect(() => {
                if (!currentUser) return;
                localStorage.setItem('studytrack_current_user', JSON.stringify(currentUser));

                const uSubjects = localStorage.getItem(`studytrack_subjects_${currentUser.id}`);
                setSubjects(uSubjects ? JSON.parse(uSubjects) : DEFAULT_SUBJECTS);

                const uAssg = localStorage.getItem(`studytrack_assignments_${currentUser.id}`);
                setAssignments(uAssg ? JSON.parse(uAssg) : DEFAULT_ASSIGNMENTS);

                const uRes = localStorage.getItem(`studytrack_research_${currentUser.id}`);
                setResearchList(uRes ? JSON.parse(uRes) : DEFAULT_RESEARCH);
            }, [currentUser?.id]);

            useEffect(() => {
                if (currentUser?.id) {
                    localStorage.setItem(`studytrack_subjects_${currentUser.id}`, JSON.stringify(subjects));
                }
            }, [subjects, currentUser?.id]);

            useEffect(() => {
                if (currentUser?.id) {
                    localStorage.setItem(`studytrack_assignments_${currentUser.id}`, JSON.stringify(assignments));
                }
            }, [assignments, currentUser?.id]);

            useEffect(() => {
                if (currentUser?.id) {
                    localStorage.setItem(`studytrack_research_${currentUser.id}`, JSON.stringify(researchList));
                }
            }, [researchList, currentUser?.id]);

            useEffect(() => {
                let timer = null;
                if (isTimerRunning && timerSeconds > 0) {
                    timer = setInterval(() => {
                        setTimerSeconds(prev => prev - 1);
                    }, 1000);
                } else if (timerSeconds === 0) {
                    setIsTimerRunning(false);
                    if (timerMode === 'work') {
                        setTimerMode('break');
                        setTimerSeconds(5 * 60);
                    } else {
                        setTimerMode('work');
                        setTimerSeconds(25 * 60);
                    }
                }
                return () => clearInterval(timer);
            }, [isTimerRunning, timerSeconds, timerMode]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const found = users.find(u => u.email.toLowerCase() === loginEmail.trim().toLowerCase());
                if (!found) {
                    setAuthError('User email not found. Please sign up first.');
                    return;
                }
                if (found.blocked) {
                    setAuthError('🚫 Your account has been blocked by System Admin. Please contact WUB support.');
                    return;
                }
                if (!found.approved && found.role !== 'admin') {
                    setAuthMode('pending');
                    return;
                }
                setCurrentUser(found);
                setAuthMode('app');
            };

            const handleSignUp = (e) => {
                e.preventDefault();
                setAuthError('');
                if (users.some(u => u.email.toLowerCase() === signupEmail.trim().toLowerCase())) {
                    setAuthError('This email is already registered.');
                    return;
                }
                const newUser = {
                    id: 'u-' + Date.now(),
                    name: signupName.trim(),
                    email: signupEmail.trim(),
                    role: 'student',
                    approved: false,
                    blocked: false,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                setUsers([...users, newUser]);
                setAuthMode('pending');
            };

            const handleApproveUser = (userId, approved) => {
                setUsers(users.map(u => u.id === userId ? { ...u, approved } : u));
            };

            const handleToggleBlockUser = (userId) => {
                setUsers(users.map(u => u.id === userId ? { ...u, blocked: !u.blocked } : u));
            };

            const handleAddCiviconPost = (e) => {
                e.preventDefault();
                if (!civTitle.trim() || !civDesc.trim()) return;
                const newPost = {
                    id: 'civ-' + Date.now(),
                    title: civTitle.trim(),
                    category: civCategory,
                    date: civDate || new Date().toISOString().split('T')[0],
                    description: civDesc.trim()
                };
                setCiviconPosts([newPost, ...civiconPosts]);
                setCivTitle('');
                setCivDesc('');
                setCivDate('');
                setCivAddedMsg(true);
                setTimeout(() => setCivAddedMsg(false), 3000);
            };

            const handleSaveNotice = (e) => {
                e.preventDefault();
                setAdminNotice(noticeInput);
                setNoticeSavedMsg(true);
                setTimeout(() => setNoticeSavedMsg(false), 3000);
            };

            // Calculated Stats for Dashboard
            const stats = useMemo(() => {
                const total = assignments.length;
                const done = assignments.filter(a => a.status === 'Done').length;
                const inProgress = assignments.filter(a => a.status === 'In Progress').length;
                const pending = assignments.filter(a => a.status === 'Pending').length;

                const donePct = total > 0 ? Math.round((done / total) * 100) : 0;
                const progressPct = total > 0 ? Math.round((inProgress / total) * 100) : 0;
                const pendingPct = total > 0 ? Math.round((pending / total) * 100) : 0;

                const totalStudyHours = assignments.reduce((acc, a) => acc + (a.estimatedHours || 0), 0);
                const completedHours = assignments.reduce((acc, a) => acc + (a.completedHours || 0), 0);
                const overdue = assignments.filter(a => new Date(a.dueDate) < new Date() && a.status !== 'Done').length;

                return { total, done, inProgress, pending, donePct, progressPct, pendingPct, totalStudyHours, completedHours, overdue };
            }, [assignments]);

            const handleAiAsk = async (e) => {
                e.preventDefault();
                if (!aiInput.trim() || aiLoading) return;

                const userQuery = aiInput.trim();
                setAiInput('');
                setAiMessages(prev => [...prev, { sender: 'user', text: userQuery }]);
                setAiLoading(true);

                try {
                    const researchContext = researchList.map(r => `[${r.type}] ${r.title} by ${r.author}: ${r.summary}`).join('\n');
                    await new Promise(r => setTimeout(r, 1000));

                    const aiReply = `Based on your research library (${researchList.length} materials) and academic sources:\n\n` +
                              `1. **Core Concept:** In response to "${userQuery}", literature highlights structured analysis and methodical execution.\n` +
                              `2. **Library Context:** Cross-reference with your saved item: "${researchList[0]?.title || 'Research Log'}" for detailed theoretical background.\n` +
                              `3. **Actionable Step:** Summarize key findings into your next assignment draft or review notes.`;

                    setAiMessages(prev => [...prev, { sender: 'ai', text: aiReply }]);
                } catch (err) {
                    setAiMessages(prev => [...prev, { sender: 'ai', text: "An error occurred while synthesizing your research query. Please try again." }]);
                } finally {
                    setAiLoading(false);
                }
            };

            // Authentication Screen Renders
            if (isMaintenanceMode && currentUser?.role !== 'admin') {
                return (
                    <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute -top-40 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div className="max-w-lg w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700 p-8 rounded-3xl shadow-2xl text-center space-y-6 z-10">
                            <div className="w-20 h-20 bg-amber-500/20 border border-amber-500/40 text-amber-400 rounded-3xl flex items-center justify-center mx-auto shadow-lg animate-pulse">
                                <LucideIcon name="Wrench" className="w-10 h-10" />
                            </div>

                            <div className="space-y-2">
                                <span className="inline-block bg-amber-500/20 text-amber-300 text-xs font-black uppercase tracking-widest px-3 py-1 rounded-full border border-amber-500/30">
                                    System Under Maintenance
                                </span>
                                <h1 className="text-2xl font-black tracking-tight text-white">StudyTrack is Currently Offline</h1>
                                <p className="text-slate-300 text-xs leading-relaxed">
                                    We are performing scheduled system maintenance and server updates. Access for students is temporarily restricted.
                                </p>
                            </div>

                            <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/80 text-left space-y-2">
                                <p className="text-[11px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                                    <LucideIcon name="Info" className="w-3.5 h-3.5" /> Maintenance Info
                                </p>
                                <p className="text-xs text-slate-300 leading-normal">
                                    All your coursework, assignments, and research data are completely safe. Please try refreshing or logging back in later.
                                </p>
                            </div>

                            <div className="pt-2 flex flex-col sm:flex-row gap-3">
                                <button
                                    onClick={() => window.location.reload()}
                                    className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-lg"
                                >
                                    <LucideIcon name="RefreshCw" className="w-4 h-4" /> Refresh Page
                                </button>
                                <button
                                    onClick={() => {
                                        const admin = users.find(u => u.role === 'admin') || DEFAULT_USERS[0];
                                        setCurrentUser(admin);
                                        setAuthMode('app');
                                    }}
                                    className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-2 border border-slate-600"
                                >
                                    <LucideIcon name="ShieldCheck" className="w-4 h-4 text-indigo-400" /> Admin Bypass
                                </button>
                            </div>

                            <p className="text-[10px] text-slate-500 font-medium">World University of Bangladesh (WUB) • IT Infrastructure</p>
                        </div>
                    </div>
                );
            }

            if (authMode === 'login') {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-md w-full space-y-6">
                            <div className="text-center">
                                <h1 className="text-3xl font-extrabold text-indigo-600 tracking-tight">StudyTrack</h1>
                                <p className="text-slate-500 text-sm mt-1">Sign in to your student or admin workspace</p>
                            </div>

                            {authError && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl font-medium">{authError}</div>}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                                    <input
                                        type="email"
                                        required
                                        placeholder="admin@studytrack.com or student email"
                                        value={loginEmail}
                                        onChange={e => setLoginEmail(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition-all text-sm">
                                    Sign In
                                </button>
                            </form>

                            <div className="border-t border-slate-100 pt-4 flex justify-between items-center text-xs text-slate-500">
                                <span>Need an account?</span>
                                <button onClick={() => { setAuthError(''); setAuthMode('signup'); }} className="text-indigo-600 font-semibold hover:underline">
                                    Sign Up
                                </button>
                            </div>

                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-center">
                                <p className="text-xs text-slate-500 mb-2 font-medium">Quick Preset Access:</p>
                                <div className="flex gap-2 justify-center">
                                    <button
                                        onClick={() => { setCurrentUser(users.find(u => u.role === 'admin') || DEFAULT_USERS[0]); setAuthMode('app'); }}
                                        className="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-medium px-3 py-1.5 rounded-lg text-xs transition-all"
                                    >
                                        👑 Login as Admin
                                    </button>
                                    <button
                                        onClick={() => { setCurrentUser(users.find(u => u.role === 'student' && u.approved) || DEFAULT_USERS[1]); setAuthMode('app'); }}
                                        className="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium px-3 py-1.5 rounded-lg text-xs transition-all"
                                    >
                                        🎓 Login as Student
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (authMode === 'signup') {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-md w-full space-y-6">
                            <div className="text-center">
                                <h1 className="text-3xl font-extrabold text-indigo-600 tracking-tight">StudyTrack</h1>
                                <p className="text-slate-500 text-sm mt-1">Create a Student Registration Account</p>
                            </div>

                            {authError && <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl font-medium">{authError}</div>}

                            <form onSubmit={handleSignUp} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="Enter your name"
                                        value={signupName}
                                        onChange={e => setSignupName(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Valid Email Address</label>
                                    <input
                                        type="email"
                                        required
                                        placeholder="yourname@student.edu"
                                        value={signupEmail}
                                        onChange={e => setSignupEmail(e.target.value)}
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    />
                                </div>

                                        <button type="button" onClick={() => setIsAddResearchOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Save Resource</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
